{% extends 'main/base.html' %}
{% load static %}
{% block content %}
<div class="reservation-form">
  <div class="container">
    <div class="row">
      <div class="col-lg-12">
        <form id="reservation-form" name="gs" method="submit" role="search" action="#">
          <div class="row">
            <div class="col-lg-12">
              <h4>Make Your <em>Reservation</em> Through This <em>Form</em></h4>
            </div>
            <div class="col-lg-6">
              <fieldset>
                <label for="Name" class="form-label">Your Name</label>
                <input type="text" name="Name" class="Name" placeholder="Ex. John Doe" autocomplete="on" required>
              </fieldset>
            </div>
            <div class="col-lg-6">
              <fieldset>
                <label for="Number" class="form-label">Your Phone Number</label>
                <input type="text" name="Number" class="Number" placeholder="Ex. +998..." autocomplete="on" required>
              </fieldset>
            </div>
            <div class="col-lg-12">
              <fieldset>
                <label for="chooseDestination" class="form-label">Choose Your Destination</label>
                <select name="Destination" class="form-select" aria-label="Default select example" id="chooseCategory"
                  onChange="this.form.click()">
                  <option selected>Where you want to go...</option>
                  <option value="Italy">Italy</option>
                  <option value="France">France</option>
                  <option value="Switzerland">Switzerland</option>
                </select>
              </fieldset>
            </div>
            <div class="col-lg-12">
              <fieldset>
                <button class="main-button">Make Your Reservation Now</button>
              </fieldset>
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
