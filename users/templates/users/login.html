{% extends 'main/base.html' %}
{% block content %}
<div class="reservation-form">
    <div class="container">
        <div class="row">
            <div class="col-lg-12">
                <form id="reservation-form" method="post">
                    {% csrf_token %}
                    <div class="row">
                        <div class="col-lg-12">
                            <h4>Login</h4>
                        </div>
                        <div class="col-lg-12">
                            {{ form.as_p }}
                        </div>
                        <div class="col-lg-12">
                            <fieldset>
                                <button class="main-button">Login Now</button>
                            </fieldset>
                        </div>
                        <div class="col-lg-12">
                            <p>Don't have an account? <a href="{% url 'register' %}">Register</a></p>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
